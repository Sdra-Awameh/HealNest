<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Animals Loading Spinner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #87CEEB 0%, #B0E0E6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .loading-container {
            position: relative;
            width: 350px;
            height: 350px;
        }

        .spinner-track {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 250px;
            height: 250px;
            transform: translate(-50%, -50%);
            border: 3px dashed rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }

        .animal-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 250px;
            height: 250px;
            transform: translate(-50%, -50%);
            animation: rotate-animals 6s linear infinite;
        }

        .animal {
            position: absolute;
            width: 50px;
            height: 50px;
            font-size: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounce-animal 2s ease-in-out infinite;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
        }

        .animal:nth-child(1) {
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 0s;
        }

        .animal:nth-child(2) {
            top: 25%;
            right: -25px;
            transform: translateY(-50%);
            animation-delay: 0.3s;
        }

        .animal:nth-child(3) {
            bottom: -25px;
            right: 50%;
            transform: translateX(50%);
            animation-delay: 0.6s;
        }

        .animal:nth-child(4) {
            bottom: 25%;
            left: -25px;
            transform: translateY(50%);
            animation-delay: 0.9s;
        }

        .animal:nth-child(5) {
            top: 15%;
            left: 15%;
            animation-delay: 1.2s;
        }

        .animal:nth-child(6) {
            top: 15%;
            right: 15%;
            animation-delay: 1.5s;
        }

        .animal:nth-child(7) {
            bottom: 15%;
            right: 15%;
            animation-delay: 1.8s;
        }

        .animal:nth-child(8) {
            bottom: 15%;
            left: 15%;
            animation-delay: 2.1s;
        }

        .center-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }

        .main-emoji {
            font-size: 60px;
            animation: pulse-heart 1.5s ease-in-out infinite;
            margin-bottom: 10px;
        }

        .loading-text {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .letter {
            display: inline-block;
            animation: wave 1.5s ease-in-out infinite;
            animation-delay: calc(var(--delay) * 0.1s);
        }

        .sub-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin-bottom: 20px;
            animation: fade 2s ease-in-out infinite;
        }

        .progress-ring {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
        }

        .progress-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #87CEEB, #B0E0E6, #87CEFA, #ADD8E6, #B0E0E6, #87CEEB);
            animation: rotate-progress 3s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-inner {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #87CEEB 0%, #B0E0E6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: float-up 4s linear infinite;
            opacity: 0;
        }

        .heart:nth-child(1) { left: 10%; animation-delay: 0s; }
        .heart:nth-child(2) { left: 20%; animation-delay: 0.5s; }
        .heart:nth-child(3) { left: 30%; animation-delay: 1s; }
        .heart:nth-child(4) { left: 40%; animation-delay: 1.5s; }
        .heart:nth-child(5) { left: 50%; animation-delay: 2s; }
        .heart:nth-child(6) { left: 60%; animation-delay: 2.5s; }
        .heart:nth-child(7) { left: 70%; animation-delay: 3s; }
        .heart:nth-child(8) { left: 80%; animation-delay: 3.5s; }

        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .sparkle {
            position: absolute;
            font-size: 15px;
            animation: twinkle 2s ease-in-out infinite;
        }

        .sparkle:nth-child(1) { top: 20%; left: 20%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 30%; right: 20%; animation-delay: 0.3s; }
        .sparkle:nth-child(3) { bottom: 30%; right: 30%; animation-delay: 0.6s; }
        .sparkle:nth-child(4) { bottom: 20%; left: 30%; animation-delay: 0.9s; }
        .sparkle:nth-child(5) { top: 10%; left: 50%; animation-delay: 1.2s; }
        .sparkle:nth-child(6) { bottom: 10%; left: 60%; animation-delay: 1.5s; }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes rotate-animals {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes bounce-animal {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0) scale(1);
            }
            40% {
                transform: translateY(-15px) scale(1.1);
            }
            60% {
                transform: translateY(-8px) scale(1.05);
            }
        }

        @keyframes pulse-heart {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        @keyframes wave {
            0%, 40%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            20% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        @keyframes fade {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes rotate-progress {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>
  

    <div class="sparkles">
        <div class="sparkle">✨</div>
        <div class="sparkle">⭐</div>
        <div class="sparkle">✨</div>
        <div class="sparkle">⭐</div>
        <div class="sparkle">✨</div>
        <div class="sparkle">⭐</div>
    </div>

    <div class="loading-container">
        <div class="spinner-track"></div>
        
        <div class="animal-container">
            <div class="animal">🐶</div>
            <div class="animal">🐱</div>
            <div class="animal">🐰</div>
            <div class="animal">🐼</div>
            <div class="animal">🦊</div>
            <div class="animal">🐨</div>
            <div class="animal">🐹</div>
            <div class="animal">🐯</div>
        </div>

        <div class="center-content">
            
            <div class="loading-text">
                <span class="letter" style="--delay: 1">L</span>
                <span class="letter" style="--delay: 2">O</span>
                <span class="letter" style="--delay: 3">A</span>
                <span class="letter" style="--delay: 4">D</span>
                <span class="letter" style="--delay: 5">I</span>
                <span class="letter" style="--delay: 6">N</span>
                <span class="letter" style="--delay: 7">G</span>
            </div>

            <div class="sub-text">Getting ready...</div>
        </div>

        
        </div>
    </div>
</body>
</html>
