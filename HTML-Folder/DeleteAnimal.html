<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Animal Health Record</title>
  <link rel="stylesheet" href="../CSS-Folder/DeleteAnimalStyle.css">
</head>
<body>
  <div class="page-container">
    <div class="form-container">
      <form action="delete_animal.php" method="POST">
        <div class="form-header">
          <h2>⚠️ Delete Pet</h2>
          <p class="subtitle">You are about to delete this animal's health record. This action cannot be undone.</p>
        </div>
        
        <!-- Input group for Animal Name -->
        <div class="input-group">
          <label for="animalName">Pet Name</label>
          <input type="text" id="animalName" name="animal_name" placeholder="Enter pet name" required>
        </div>

        <!-- Input group for Species -->
        <div class="input-group">
          <label for="Owner">Owner name</label>
          <input type="text" id="Owner" name="Owner" placeholder="Owner name" required>
        </div>

        <!-- Input group for Age -->
        <div class="input-group">
          <label for="age">Age</label>
          <input type="text" id="age" name="age" placeholder="Enter age" required>
        </div>

       
        <!-- Button Group -->
        <div class="button-group">
          <button type="button" class="button secondary" onclick="window.location.href='index.html'">Cancel</button>
          <button type="submit" class="button primary">Delete Record</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
