<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>HealNest - Edit Pet Record</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../Assets/css/UpdateAnimalStyle.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body>
    <div class="page-container">
        <div class="form-container">
            <div class="form-header">
                <h2>🐾 Edit Pet Record</h2>
                <p class="subtitle">Update pet details below</p>
            </div>

            <form id="editPetForm">
                <input type="hidden" id="petId" name="id">
                <div class="form-section">
                    <h3>Pet Information</h3>

                    <div class="input-row">
                        <div class="input-group">
                            <label for="animalName">Pet Name</label>
                            <input type="text" id="animalName" name="animal_name" required>
                        </div>
                        <div class="input-group">
                            <label for="animalType">Pet Type</label>
                            <select id="animalType" name="animal_type" required>
                                <option value="" disabled>Select type</option>
                                <option value="Dog">Dog</option>
                                <option value="Cat">Cat</option>
                                <option value="Bird">Bird</option>
                                <option value="Rabbit">Rabbit</option>
                                <option value="Hamster">Hamster</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label for="breed">Breed</label>
                            <input type="text" id="breed" name="breed">
                        </div>
                        <div class="input-group">
                            <label for="color">Color</label>
                            <input type="text" id="color" name="color">
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label for="age">Age (years)</label>
                            <input type="number" id="age" name="age" min="0" step="0.1" required>
                        </div>
                        <div class="input-group">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender" required>
                                <option value="" disabled>Select gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group full-width">
                        <label for="microchip">Microchip Number</label>
                        <input type="text" id="microchip" name="microchip">
                    </div>
                </div>

                <div class="form-section">
                    <h3>Owner Information</h3>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="owner">Owner's Name</label>
                            <input type="text" id="owner" name="owner_name" required>
                        </div>
                        <div class="input-group">
                            <label for="ownerPhone">Owner's Phone</label>
                            <input type="tel" id="ownerPhone" name="owner_phone">
                        </div>
                    </div>
                    <div class="input-group full-width">
                        <label for="ownerEmail">Owner's Email</label>
                        <input type="email" id="ownerEmail" name="owner_email">
                    </div>
                </div>

                <div class="form-section">
                    <h3>Medical Information</h3>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="checkDate">Medical Check Date</label>
                            <input type="date" id="checkDate" name="check_date" required>
                        </div>
                        <div class="input-group">
                            <label for="nextCheckup">Next Checkup</label>
                            <input type="date" id="nextCheckup" name="next_checkup">
                        </div>
                    </div>
                    <div class="input-group full-width">
                        <label for="medicalNotes">Medical Notes</label>
                        <textarea id="medicalNotes" name="medical_notes" rows="3"></textarea>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="button primary">Update Pet Record</button>
                    <button type="button" class="button secondary" onclick="window.location.href='HomePage.html'">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../Assets/js/notifications.js"></script>
    <script src="../Assets/js/backend-conn.js"></script>    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const petId = urlParams.get('id');
        
        if (!petId) {
            showNotification('No pet ID provided', 'error');
        
        } else {
            document.getElementById('petId').value = petId;
            // Fetch pet data
            fetch(`../CRUD/getPetById.php?id=${petId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const pet = data.data;
                        // Fill the form with pet data
                        document.getElementById('animalName').value = pet.animal_name;
                        document.getElementById('animalType').value = pet.animal_type;
                        document.getElementById('breed').value = pet.breed;
                        document.getElementById('color').value = pet.color;
                        document.getElementById('age').value = pet.age;
                        document.getElementById('gender').value = pet.gender;
                        document.getElementById('microchip').value = pet.microchip;
                        document.getElementById('owner').value = pet.owner_name;
                        document.getElementById('ownerPhone').value = pet.owner_phone;
                        document.getElementById('ownerEmail').value = pet.owner_email;
                        document.getElementById('checkDate').value = pet.check_date;
                        document.getElementById('nextCheckup').value = pet.next_checkup;
                        document.getElementById('medicalNotes').value = pet.medical_notes;
                    } else {
                        showNotification(data.message || 'Error fetching pet data', 'error');
                    }
                })
                .catch(error => {
                    showNotification('Error fetching pet data', 'error');
                    console.error('Error:', error);
                });
        }

        document.getElementById('editPetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Disable submit button to prevent double submission
            const submitButton = this.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            
            const formData = {
                id: document.getElementById('petId').value,
                animal_name: document.getElementById('animalName').value,
                animal_type: document.getElementById('animalType').value,
                breed: document.getElementById('breed').value,
                color: document.getElementById('color').value,
                age: parseFloat(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                microchip: document.getElementById('microchip').value,
                owner_name: document.getElementById('owner').value,
                owner_phone: document.getElementById('ownerPhone').value,
                owner_email: document.getElementById('ownerEmail').value,
                check_date: document.getElementById('checkDate').value,
                next_checkup: document.getElementById('nextCheckup').value,
                medical_notes: document.getElementById('medicalNotes').value
            };

            try {
                const response = await fetch('../CRUD/UpdateAnimal.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Failed to update pet record');
                }

                showNotification('Pet record updated successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'ViewAnimal.html';
                }, 3000);

            } catch (error) {
                showNotification(error.message, 'error');
                // Re-enable submit button
                submitButton.disabled = false;
                submitButton.innerHTML = 'Update Pet Record';
            }
        });
    </script>
</body>
</html>
